<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<title>CARDS</title>
<style>
    body{
        background-color: blueviolet;
        h1{
            background-color: azure;
            text-align: center;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 15px;
        }
        .box{
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform0.3s;
        
        }
        .box:hover{
            transform: scale(1.1);
        }
    }
</style>
<body>
    <h1>SHOPPING</h1>
    <div class="container">
        <div class="box">HOME</div>
        <div class="box">SEARCH</div>
        <div class="box">ACCOUNT</div>
        <div class="box">ABOUT</div>
    </div>
    
</body>
</html>
