<style>
    body{
        background:linear-gradient(to bottom,#1e3a8a,#000000);
        background-repeat: repeat;
        background-size:cover;
        height: 150vh;
        text-align: center;
        padding: 15PX;
        border-radius: 10px;
        border-color: white;
    }
     h1{
        width: 100vw;
     color: white;
     text-align: center;
     padding: 10px;
     background-color: #0000003d;
     text-decoration: wavy;
     
     }
     .container{
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        padding: 30px;
      
     }
     .box{
        background: white;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        transition: transform0.3s;
     }
     .box:hover{
        transform: scale(1.1);
     } 
     
     @media(max-width: 768px){
        .container{
            grid-template-columns: repeat(2,1fr);
        }
     }
     button{
        display: grid;
        border-radius: 10px;
        background-color: aqua;
        margin: auto;
        padding: 10px;
     }
     button:hover{
        transform: scale(1.1);

     }
     .grid-container{
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 20px;
      padding: 15px;
      max-width: 500px;
      margin: auto;
      transition: transform0.3s;
      
     }
     .card1{
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: #ddd;
      height: 160px;
     }
     .card2{
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: #ddd;
      height: 160px;
     }
     .card3{
      position: relative;

      background: #ddd;
      height: 160px;
     }
     .card4{
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: #ddd;
      height: 160px;
     }
     .card1 img{
      width: 95;
      height: 95%;
      object-fit: cover;
      background: #ddd;
     }
     .card2 img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #ddd;
     }
     .card3 img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #ddd;
     }
     .card4 img{
      width: 100%;
      height: 110%;
      object-fit: cover;
      background: #ddd;
     }
     .grid-container .card1:hover{
      transform: scale(1.1);
     }
     .grid-container .card2:hover{
      transform: scale(1.1);
     }
     .grid-container .card3:hover{
      transform: scale(1.1);
     }
     .grid-container .card4:hover{
      transform: scale(1.1);
     }
</style>
