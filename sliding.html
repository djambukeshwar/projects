<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Automatic Image Shuffle</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .slider {
      width: 800px;
      height: 450px;
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    .slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slider img.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="slider">
    <img src="https://picsum.photos/id/1015/800/450" class="active">
    <img src="https://picsum.photos/id/1016/800/450">
    <img src="https://picsum.photos/id/1018/800/450">
    <img src="https://picsum.photos/id/1020/800/450">
  </div>

  <script>
    const images = document.querySelectorAll('.slider img');
    let current = 0;

    function shuffleImages() {
      images[current].classList.remove('active');

      current = (current + 1) % images.length;

      images[current].classList.add('active');
    }

    setInterval(shuffleImages, 3000); // Change image every 3 seconds
  </script>

</body>
</html>
