<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burger King</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }body {
    scroll-behavior: smooth;
}

section {
    width: 100%;
    height: 100vh;
    background-color: #c40000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 60px;
    margin-bottom: 20px;
}

p {
    font-size: 22px;
    margin-bottom: 20px;
}

.images {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
}

.images img {
    width: 300px;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    transition: transform 0.3s ease;
}

.images img:hover {
    transform: scale(1.1);
}

nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(0,0,0,0.7);
    padding: 15px;
    text-align: center;
    z-index: 1000;
}

nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
    font-size: 18px;
    transition: color 0.3s;
}

nav a:hover {
    color: yellow;
}

</style>
</head>

    <a href="#burgers">Burgers</a>
    <a href="#drinks">Drinks</a>
    <a href="#special">Special</a>

    </div>
